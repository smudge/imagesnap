name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Linux camera development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev pkg-config
      - name: Build
        run: cargo build --locked --workspace --all-targets --verbose
      - name: Run tests
        run: cargo test --locked --workspace --all-targets --verbose
